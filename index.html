        { prompt: "Which sentence correctly uses parallel infinitives?", options: ["They plan to travel, studying, and working.", "They plan traveling, to study, and working.", "They plan to travel, to study, and to work.", "They plan travel, study, and to work."], correct: "They plan to travel, to study, and to work." },
        { prompt: "Which sentence needs correction because of faulty parallelism?", options: ["She likes reading and writing.", "She likes to read and to write.", "She likes reading and to write.", "She likes to read and write."], correct: "She likes reading and to write." },
        { prompt: "Which is the best correction? He enjoys hiking, to swim, and cycling.", options: ["He enjoys hiking, swimming, and cycling.", "He enjoys to hike, swimming, and cycling.", "He enjoys hiking, to swim, and to cycle.", "He enjoys hike, swim, and cycle."], correct: "He enjoys hiking, swimming, and cycling." },
        { prompt: "Choose the correct sentence: ___ English every day helps improve fluency.", options: ["To practicing", "Practice", "Practicing", "Practiced"], correct: "Practicing" },
        { prompt: "Choose the best answer: She decided ___ abroad because she enjoys ___ new cultures.", options: ["studying / to experience", "to study / experiencing", "studying / experiencing", "to studying / experience"], correct: "to study / experiencing" }
    ];

    // Shuffle array function (Fisher-Yates)
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    let shuffledQuestions = [];
    let userAnswers = new Array(100).fill(null);
    let warningCount = 0;
    let isSubmitted = false;

    const questionsContainer = document.getElementById('questionsContainer');
    const submitBtn = document.getElementById('submitQuizBtn');
    const modal = document.getElementById('resultModal');
    const modalContent = document.getElementById('modalContent');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const warningCounterSpan = document.getElementById('warningCounterSpan');
    const progressDisplay = document.getElementById('progressDisplay');

    function updateWarningUI() {
        warningCounterSpan.innerHTML = `⚠️ Warning ${warningCount} / 2`;
        if (warningCount >= 2) {
            warningCounterSpan.style.color = "#ffaa66";
            warningCounterSpan.style.fontWeight = "bold";
        }
        if (warningCount >= 3) {
            warningCounterSpan.innerHTML = `⛔ Force submission triggered`;
        }
    }

    function updateProgress() {
        const answered = userAnswers.filter(a => a !== null).length;
        progressDisplay.textContent = `${answered} / 100`;
    }

    function disableQuizInputs() {
        const allRadios = document.querySelectorAll('input[type="radio"]');
        allRadios.forEach(radio => radio.disabled = true);
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.6';
        submitBtn.style.cursor = 'default';
    }

    function forceAutoSubmit(reason) {
        if (isSubmitted) return;
        alert(`⚠️ ${reason} The quiz will be submitted now.`);
        submitQuiz(true);
    }

    function renderQuestions() {
        questionsContainer.innerHTML = '';
        shuffledQuestions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            const selectedVal = userAnswers[idx] || '';
            card.innerHTML = `
                <div class="question-text">
                    <span class="q-num">Q${idx+1}</span>
                    <span class="target-text">${q.prompt}</span>
                </div>
                <div class="options" data-qidx="${idx}">
                    ${q.shuffledOptions.map(opt => `
                        <div class="option-radio ${selectedVal === opt ? 'selected' : ''}" data-opt="${opt}">
                            <input type="radio" name="q${idx}" value="${opt}" id="q${idx}_${opt.replace(/\s/g, '_').replace(/\//g, '_').replace(/"/g, '')}" ${selectedVal === opt ? 'checked' : ''}>
                            <label for="q${idx}_${opt.replace(/\s/g, '_').replace(/\//g, '_').replace(/"/g, '')}">${opt}</label>
                        </div>
                    `).join('')}
                </div>
            `;
            questionsContainer.appendChild(card);
            const radioInputs = card.querySelectorAll('input[type="radio"]');
            radioInputs.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const chosenValue = e.target.value;
                    userAnswers[idx] = chosenValue;
                    const optsDivs = card.querySelectorAll('.option-radio');
                    optsDivs.forEach(div => {
                        const optVal = div.getAttribute('data-opt');
                        if (optVal === chosenValue) div.classList.add('selected');
                        else div.classList.remove('selected');
                    });
                    updateProgress();
                });
            });
        });
        updateProgress();
    }

    function computeScoreAndSummary() {
        let correctCount = 0;
        const details = [];
        for (let i = 0; i < shuffledQuestions.length; i++) {
            const q = shuffledQuestions[i];
            const userChoice = userAnswers[i];
            const isCorrect = (userChoice === q.correct);
            if (isCorrect) correctCount++;
            details.push({
                idx: i+1,
                prompt: q.prompt,
                userAnswer: userChoice || '(not answered)',
                correctAnswer: q.correct,
                isCorrect: isCorrect
            });
        }
        const totalScore = correctCount;
        return { correctCount, totalScore, details };
    }

    function submitQuiz(isForced = false) {
        if (isSubmitted) return;
        isSubmitted = true;
        const { correctCount, totalScore, details } = computeScoreAndSummary();
        let summaryHtml = `<div style="margin-bottom: 12px;"><strong>✅ Score: ${totalScore} / 100</strong> (${correctCount} correct answers out of 100)</div>`;
        summaryHtml += `<div style="font-size:0.85rem; margin-bottom: 16px;">📊 ${correctCount} / 100 correct answers</div>`;
        summaryHtml += `<div style="max-height: 400px; overflow-y: auto;">`;
        details.forEach(d => {
            const statusIcon = d.isCorrect ? '✔️' : '❌';
            const userShow = d.userAnswer || '—';
            const colorClass = d.isCorrect ? 'correct-ans' : 'wrong-ans';
            summaryHtml += `
                <div class="summary-item">
                    <strong>${d.idx}.</strong> ${d.prompt}<br>
                    <span>Your: <span class="${colorClass}">${userShow}</span></span> &nbsp; | &nbsp;
                    Correct: <strong>${d.correctAnswer}</strong> ${statusIcon}
                </div>
            `;
        });
        summaryHtml += `</div><p style="margin-top:12px;">*Scoring: each correct = 1 point. Max 100.</p>`;
        modalContent.innerHTML = summaryHtml;
        modal.classList.add('active');
        disableQuizInputs();
    }

    function initQuiz() {
        // Shuffle questions first
        const shuffledRaw = shuffleArray([...RAW_QUESTIONS]);
        // For each question, shuffle its options
        shuffledQuestions = shuffledRaw.map(q => {
            const shuffled = shuffleArray([...q.options]);
            return {
                prompt: q.prompt,
                shuffledOptions: shuffled,
                correct: q.correct
            };
        });
        userAnswers.fill(null);
        warningCount = 0;
        isSubmitted = false;
        updateWarningUI();
        renderQuestions();
    }

    // Anti-cheat handlers
    function handleVisibilityChange() {
        if (isSubmitted) return;
        if (document.hidden) {
            warningCount++;
            updateWarningUI();
            if (warningCount <= 2) alert(`⚠️ WARNING ${warningCount}/2: Do not switch tabs/windows. Further violation forces submission.`);
            if (warningCount >= 3) forceAutoSubmit("Tab switching violation.");
        }
    }

    let splitGiven = false;
    function detectSplitScreen() {
        if (isSubmitted) return;
        const screenW = window.screen.width;
        const winW = window.outerWidth;
        if (winW < screenW * 0.75 && winW > 100 && !splitGiven) {
            splitGiven = true;
            warningCount++;
            updateWarningUI();
            alert("⚠️ Split screen detected! Warning added.");
            if (warningCount >= 3) forceAutoSubmit("Split screen limit.");
        }
    }

    function antiScreenshot(e) {
        if (isSubmitted) return;
        if (e.key === 'PrintScreen' || (e.ctrlKey && e.key === 'p') || (e.ctrlKey && e.shiftKey && (e.key === 'S' || e.key === 's'))) {
            e.preventDefault();
            warningCount++;
            updateWarningUI();
            alert(`⚠️ Screenshot attempt! Warning ${warningCount}/2`);
            if (warningCount >= 3) forceAutoSubmit("Screenshot violation.");
            return false;
        }
        if (e.type === 'contextmenu') {
            e.preventDefault();
            warningCount++;
            updateWarningUI();
            alert("Right-click disabled. Warning added.");
            if (warningCount >= 3) forceAutoSubmit("Context menu abuse.");
            return false;
        }
    }

    function preventDevTools(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
            e.preventDefault();
            warningCount++;
            updateWarningUI();
            alert("DevTools blocked. Warning " + warningCount + "/2");
            if (warningCount >= 3) forceAutoSubmit("DevTools usage.");
            return false;
        }
    }

    document.addEventListener('visibilitychange', handleVisibilityChange);
    window.addEventListener('resize', detectSplitScreen);
    window.addEventListener('keydown', antiScreenshot);
    window.addEventListener('contextmenu', antiScreenshot);
    document.addEventListener('keydown', preventDevTools);
    document.addEventListener('copy', (e) => { e.preventDefault(); warningCount++; updateWarningUI(); alert("Copy disabled."); if(warningCount>=3) forceAutoSubmit("Copy attempt."); });
    document.addEventListener('cut', (e) => { e.preventDefault(); warningCount++; updateWarningUI(); if(warningCount>=3) forceAutoSubmit(); });
    document.addEventListener('paste', (e) => { e.preventDefault(); warningCount++; updateWarningUI(); if(warningCount>=3) forceAutoSubmit(); });

    submitBtn.addEventListener('click', () => {
        if (isSubmitted) return;
        const confirmSubmit = confirm("Are you sure you want to submit your answers? You cannot change after submission.");
        if (confirmSubmit) submitQuiz(false);
    });

    closeModalBtn.addEventListener('click', () => {
        modal.classList.remove('active');
    });

    initQuiz();
</script>
</body>
</html>
